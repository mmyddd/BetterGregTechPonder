buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.142'
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

version = mod_version
base { archivesName = archives_base_name }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets.main.resources.srcDir 'src/generated/resources'

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// datagen 的增量缓存留在仓库里，但不该进 mod jar。
jar {
    exclude '.cache/**'
    manifest {
        attributes 'MixinConfigs': 'bettergregtechponder.mixins.json'
    }
}

// 内嵌的 Ponder 生产 jar 是 SRG 命名，metadata 必须标 isObfuscated=true，开发环境才会去重映射它。
tasks.named('jarJar').configure {
    doLast {
        def metadataFile = outputDirectory.file('META-INF/jarjar/metadata.json').get().asFile
        def originalMetadata = metadataFile.getText('UTF-8')
        def updatedMetadata = originalMetadata.replaceAll(/"isObfuscated"\s*:\s*false/, '"isObfuscated": true')
        if (updatedMetadata == originalMetadata) {
            throw new GradleException('Ponder JarJar metadata did not contain an obfuscation flag')
        }
        metadataFile.setText(updatedMetadata, 'UTF-8')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { name = 'firstdarkdev'; url = 'https://maven.firstdarkdev.xyz/snapshots' }
    maven { url = 'https://maven.tterrag.com/' }
    maven {
        name = 'CurseForge'
        url = 'https://cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://modmaven.dev' }
}

legacyForge {

    enable {
        forgeVersion = project.minecraft_version + '-' + project.forge_version
        disableRecompilation = false
    }

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        client {
            client()
            jvmArgument '-Xmx4G'
        }
        server {
            server()
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll(
                '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modCompileOnly "curse.maven:gregtechceu-modern-890405:${gtceu_file_id}"
    modCompileOnly "com.lowdragmc.ldlib:ldlib-forge-1.20.1:${ldlib_version}"
    modCompileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    modCompileOnly "dev.toma.configuration:configuration-forge-1.20.1:${configuration_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}"
    modCompileOnly "dev.architectury:architectury-forge:${architectury_version}"
    // Ponder 是独立 mod（modId=ponder），本 mod 只依赖它，不再依赖 Create。
    modImplementation "net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}"

    modRuntimeOnly "curse.maven:gregtechceu-modern-890405:${gtceu_file_id}"
    modRuntimeOnly "com.lowdragmc.ldlib:ldlib-forge-1.20.1:${ldlib_version}"
    modRuntimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    modRuntimeOnly "dev.toma.configuration:configuration-forge-1.20.1:${configuration_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}"
    modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"
    // Ponder 以 jar-in-jar 内嵌进本 mod 的 jar：玩家不再需要安装 Create，也不需要单装 Ponder。
    // 依赖用非 mod 的 jarJar 配置，拿到的是 SRG 命名的生产 jar（见下方 metadata 修正）。
    // 上面的 modImplementation 已让开发环境（runClient）能直接加载 Ponder，无需再单列 modRuntimeOnly。
    jarJar("net.createmod.ponder:Ponder-Forge-1.20.1:${ponder_version}") { transitive = false }
    // Ponder 把 flywheel 声明成 mandatory 的 CLIENT 依赖，原来这个 jar 由 Create 带进来；去掉 Create 后必须自己内嵌，
    // 否则 Ponder 会因为缺 flywheel 直接加载失败。flywheel 是 MIT，可以一起分发。
    jarJar("dev.engine-room.flywheel:flywheel-forge-1.20.1:${flywheel_version}") { transitive = false }

    modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${jei_version}"
    modRuntimeOnly "maven.modrinth:justenoughcharacters:${jecharacters_version}"
}
